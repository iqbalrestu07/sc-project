services:
  # ─────────────────────────── Backend (Go) ──────────────────────────────────
  # Database berada di Supabase (managed PostgreSQL) — tidak ada container
  # postgres lokal lagi. Konfigurasi koneksi dibaca dari env vars di bawah.
  backend:
    image: ghcr.io/iqbalrestu07/sc-project-backend:latest
    build:
      context: ./sc-pos-be
      dockerfile: Dockerfile
    container_name: sc_backend
    restart: unless-stopped
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      # ── Database (Supabase) ───────────────────────────────────────────
      DB_HOST: ${DB_HOST:-db.xtgitbuwmrsdwdmmbmdl.supabase.co}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-postgres}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      # ── JWT ───────────────────────────────────────────────────────────
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      JWT_REFRESH_EXPIRY_HOURS: ${JWT_REFRESH_EXPIRY_HOURS:-168}
      # ── Public URLs ───────────────────────────────────────────────────
      BASE_URL: ${BACKEND_BASE_URL:-http://localhost:8080}
      UPLOAD_DIR: uploads
      DEFAULT_PUBLIC_ORG_SLUG: ${DEFAULT_PUBLIC_ORG_SLUG:-}
      # ── Storage (local | supabase) ────────────────────────────────────
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-ap-southeast-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # ── WhatsApp (opsional) ───────────────────────────────────────────
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
    volumes:
      - backend_uploads:/app/uploads
    # Hanya expose backend ke localhost host untuk debugging darurat.
    # Akses publik dilewatkan melalui reverse proxy /api di frontend/nginx.
    ports:
      - "127.0.0.1:${BACKEND_PORT_EXPOSE:-8080}:8080"

  # ─────────────────────────── Frontend (React + Nginx) ──────────────────────
  frontend:
    image: ghcr.io/iqbalrestu07/sc-project-frontend:latest
    build:
      context: ./shasi
      dockerfile: Dockerfile
      args:
        # Untuk deploy single-domain, gunakan path relatif /api agar nginx frontend
        # yang meneruskan request ke backend internal.
        # Contoh single-domain : /api
        # Contoh multi-domain  : https://api.namadomain.com/api
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: sc_frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Expose ke semua interface agar bisa diakses dari LAN
    ports:
      - "127.0.0.1:${FRONTEND_PORT_EXPOSE:-3000}:80"

  # ─────────────────────────── Cloudflare Tunnel ─────────────────────────────
  # Tunnel ini menggantikan kebutuhan port forwarding di router.
  # Cocok untuk IndiHome / provider CGNAT yang tidak support port forwarding.
  #
  # Cara mendapatkan CLOUDFLARE_TUNNEL_TOKEN:
  #   1. Buka https://one.dash.cloudflare.com
  #   2. Networks → Tunnels → Create a tunnel → pilih Cloudflared
  #   3. Beri nama tunnel (misal: sc-klinik)
  #   4. Copy token yang muncul, masukkan ke .env sebagai CLOUDFLARE_TUNNEL_TOKEN
  #   5. Di halaman yang sama, tambahkan 1 public hostname (single-domain):
  #      - namadomain.com (atau app.namadomain.com)
  #        → Service: HTTP  → URL: frontend:80
  #      Backend diakses via /api dan /uploads melalui nginx reverse proxy.
  #
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sc_cloudflared
    restart: unless-stopped
    # Hanya dijalankan ketika token tersedia: docker compose --profile cloudflare up -d
    profiles:
      - cloudflare
    depends_on:
      - frontend
      - backend
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    # Tidak perlu expose port apapun — tunnel berjalan outbound dari dalam container

volumes:
  backend_uploads:
